name = "cloudflare-workers-chat-v2"
compatibility_date = "2024-01-01"
main = "src/v2/index.mjs"
workers_dev = true

routes = [
  { pattern = "chatnew.liuxiyu.cn", zone_name = "liuxiyu.cn", custom_domain = true, enabled = true, previews_enabled = false },
]

[durable_objects]
bindings = [
  { name = "rooms", class_name = "ChatRoom", script_name = "cloudflare-workers-chat", binding_name = "rooms" },
  { name = "registry", class_name = "RoomRegistry", script_name = "cloudflare-workers-chat", binding_name = "registry" },
  { name = "archive", class_name = "VersionArchive", script_name = "cloudflare-workers-chat", binding_name = "archive" },
  { name = "filebucket", class_name = "FileBucket", script_name = "cloudflare-workers-chat", binding_name = "filebucket" },
]

[[rules]]
type = "Data"
globs = ["**/*.html", "**/*.js", "**/*.css"]
fallthrough = false

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

