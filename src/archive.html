<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本存档 - CloudChat</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a6cf7">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5; color: #1a1a2e; padding: 20px; max-width: 800px; margin: 0 auto;
}
.header {
  text-align: center; padding: 30px 0 20px;
}
.header h1 { font-size: 28px; font-weight: 700; color: #4a6cf7; margin-bottom: 6px; }
.header p { color: #888; font-size: 14px; }
.header .back-link {
  display: inline-block; margin: 12px 8px 0; color: #4a6cf7; text-decoration: none;
  font-size: 14px; padding: 6px 16px; border: 1px solid #4a6cf7; border-radius: 20px;
  transition: all 0.2s;
}
.header .back-link:hover { background: #4a6cf7; color: #fff; }
#loading { text-align: center; color: #888; padding: 60px 0; font-size: 15px; }
#empty { text-align: center; color: #888; padding: 60px 0; font-size: 15px; display: none; }
.version-list { display: flex; flex-direction: column; gap: 12px; }
.version-card {
  background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  padding: 16px 20px; display: flex; align-items: center; gap: 16px;
  transition: box-shadow 0.2s;
}
.version-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.version-card .v-icon {
  width: 44px; height: 44px; border-radius: 50%; background: #e8f0fe;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #4a6cf7; flex-shrink: 0;
}
.version-card .v-info { flex: 1; min-width: 0; }
.version-card .v-name { font-size: 16px; font-weight: 700; color: #1a1a2e; }
.version-card .v-desc { font-size: 13px; color: #666; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.version-card .v-date { font-size: 12px; color: #999; margin-top: 4px; }
.version-card .v-size { font-size: 12px; color: #999; }
.version-card .v-actions { display: flex; gap: 6px; flex-shrink: 0; }
.version-card .v-actions a, .version-card .v-actions button {
  padding: 6px 14px; border: 1px solid #4a6cf7; color: #4a6cf7; background: #fff;
  border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none;
  transition: all 0.15s; white-space: nowrap;
}
.version-card .v-actions a:hover, .version-card .v-actions button:hover { background: #4a6cf7; color: #fff; }
.version-card .v-actions .btn-del { border-color: #e74c3c; color: #e74c3c; }
.version-card .v-actions .btn-del:hover { background: #e74c3c; color: #fff; }
@media (max-width: 600px) {
  body { padding: 12px; }
  .header h1 { font-size: 22px; }
  .version-card { flex-wrap: wrap; padding: 12px 14px; }
  .version-card .v-actions { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📦 版本存档</h1>
  <p>CloudChat 所有历史版本的归档文件</p>
  <a class="back-link" href="/">← 返回聊天室</a>
  <a class="back-link" href="/changelog">📋 更新日志</a>
</div>

<div id="loading">加载中...</div>
<div id="empty">暂无存档版本</div>
<div class="version-list" id="version-list"></div>

<script>
async function loadVersions() {
  let loading = document.getElementById("loading");
  let empty = document.getElementById("empty");
  let list = document.getElementById("version-list");

  try {
    let r = await fetch("/api/archive/list");
    let versions = await r.json();
    loading.style.display = "none";

    if (!versions || versions.length === 0) {
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";
    list.innerHTML = versions.map(v => {
      let date = new Date(v.timestamp);
      let dateStr = date.getFullYear() + "/" +
        String(date.getMonth() + 1).padStart(2, "0") + "/" +
        String(date.getDate()).padStart(2, "0") + " " +
        String(date.getHours()).padStart(2, "0") + ":" +
        String(date.getMinutes()).padStart(2, "0");
      let sizeStr = v.size < 1024 ? v.size + " B" :
        v.size < 1024 * 1024 ? (v.size / 1024).toFixed(1) + " KB" :
        (v.size / (1024 * 1024)).toFixed(1) + " MB";
      let desc = v.description || "";
      return '<div class="version-card">' +
        '<div class="v-icon">📦</div>' +
        '<div class="v-info">' +
          '<div class="v-name">' + escapeHtml(v.name) + '</div>' +
          (desc ? '<div class="v-desc">' + escapeHtml(desc) + '</div>' : '') +
          '<div class="v-date">' + dateStr + ' · ' + sizeStr + '</div>' +
        '</div>' +
        '<div class="v-actions">' +
          '<a href="/api/archive/download/' + encodeURIComponent(v.name) + '" download="' + v.name + '.zip">⬇ 下载</a>' +
        '</div>' +
      '</div>';
    }).join("");
  } catch (e) {
    loading.textContent = "加载失败: " + e.message;
  }
}

function escapeHtml(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

loadVersions();
</script>

</body>
</html>
