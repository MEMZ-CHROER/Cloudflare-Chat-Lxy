name = "cloudflare-workers-chat"
compatibility_date = "2024-01-01"

main = "src/index.mjs"

workers_dev = true

# 路由配置已移至 Cloudflare Dashboard 管理，仓库中不保留
# 如需添加/修改路由，请在 Dashboard → Workers → cloudflare-workers-chat → Triggers 中操作

[durable_objects]
bindings = [
  { name = "rooms", class_name = "ChatRoom" },
  { name = "registry", class_name = "RoomRegistry" },
  { name = "archive", class_name = "VersionArchive" },
  { name = "filebucket", class_name = "FileBucket" },
]

[[rules]]
type = "Data"
globs = ["**/*.html", "**/*.js", "**/*.css"]
fallthrough = false

# Indicate that you want the ChatRoom class to be callable as a Durable Object.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
ADMIN_SECRET_KEY = "9167c945079746dbfa6cd249df4ad64f102e9e34a366624539ee3ac7cfefa16e"
ADMIN_KEY = "7a7be27563c45956c313005973b4902a15b7a1008c207c05"
# 独立销毁口令：聊天框输入 /destroy <口令> 可销毁当前房间（仅此命令生效，不授予其他权限）
DESTROY_KEY = "lxy130523"
